<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/><style>
html,body,#globe{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{touch-action:none}
canvas{display:block}
#fallback{display:none;position:fixed;inset:0;color:#A5AFB8;text-align:center;padding:35vh 15px 0;box-sizing:border-box;background:#05080D}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#05080D;color:#A5AFB8;z-index:10;transition:opacity .4s}
#boot.done{opacity:0;pointer-events:none}
.boot-ring{display:block;width:34px;height:34px;border-radius:50%;border:2px solid rgba(165,175,184,.25);border-top-color:#6496E6;animation:boot-spin 1s linear infinite}
#boot span{font-size:12px;letter-spacing:.22em;text-transform:uppercase}
@keyframes boot-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.boot-ring{animation:none;border-top-color:rgba(165,175,184,.5)}}
#spin-toggle{position:absolute;right:16px;bottom:16px;width:48px;height:48px;border:0;border-radius:50%;background:rgba(255,255,255,.28);color:#E8EDF0;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;transition:background .2s;-webkit-tap-highlight-color:transparent}
#spin-toggle:hover{background:rgba(255,255,255,.45)}
#spin-toggle svg{width:22px;height:22px;fill:currentColor}
</style>  <script type="module" crossorigin src="./assets/index-CjK45owz.js"></script>
</head><body><div id="globe"></div><div id="boot" role="status" aria-label="Loading globe"><i class="boot-ring"></i><span>OURWORLD</span></div><div id="fallback" role="img" aria-label="Globe unavailable"></div>
<button id="spin-toggle" type="button" aria-label="Pause rotation">
<svg id="spin-pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/></svg>
<svg id="spin-play-icon" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M8 5v14l11-7z"/></svg>
</button></body></html>
