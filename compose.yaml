name: ourworld

x-api-environment: &api-environment
  NODE_ENV: production
  PORT: 3000
  DATABASE_URL: postgresql://ourworld:${POSTGRES_PASSWORD:-ourworld_dev}@postgres:5432/ourworld
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:?Run uv run ourworld setup first}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-Ourworld2026!}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8188}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8188,http://127.0.0.1:8188}
  S3_ENDPOINT: http://storage:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ourworld}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-ourworld_local_storage_only}
  S3_BUCKET: ${S3_BUCKET:-ourworld}
  S3_REGION: us-east-1
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  SMTP_FROM: Ourworld <hello@ourworld.test>
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_STRUCTURED_OUTPUT: ${LLM_STRUCTURED_OUTPUT:-false}
  LLM_OUTPUT_MODE: ${LLM_OUTPUT_MODE:-json}
  AUTH_LOGIN_LIMIT: ${AUTH_LOGIN_LIMIT:-60}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ourworld
      POSTGRES_USER: ourworld
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ourworld_dev}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ourworld -d ourworld"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  storage:
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.50}
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-ourworld}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-ourworld_local_storage_only}
      S3_BUCKET: ${S3_BUCKET:-ourworld}
    ports: ["127.0.0.1:8333:8333"]
    volumes: ["storage-data:/data"]
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
  migrate:
    image: ourworld-api:local
    build: { context: ., target: api }
    environment: *api-environment
    command: ["node", "apps/api/dist/migrate.js"]
    depends_on:
      postgres: { condition: service_healthy }
  seed:
    image: ourworld-api:local
    environment: *api-environment
    command: ["node", "apps/api/dist/seed.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  api:
    image: ourworld-api:local
    environment: *api-environment
    init: true
    depends_on:
      seed: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      storage: { condition: service_started }
      mailpit: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  worker:
    image: ourworld-api:local
    environment: *api-environment
    command: ["node", "apps/api/dist/worker.js"]
    init: true
    depends_on:
      seed: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      storage: { condition: service_started }
      mailpit: { condition: service_started }
    restart: unless-stopped
  frontend-release:
    profiles: [release]
    image: ${OURWORLD_FRONTEND_RELEASE_IMAGE:-ourworld-frontend-release:local}
    build: { context: ., target: frontend-release }
    volumes: ["frontend-releases:/srv/frontend"]
  gateway:
    image: ourworld-web:local
    build: { context: ., target: web }
    ports: ["${WEB_PORT:-8188}:80"]
    volumes: ["frontend-releases:/srv/frontend:ro"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
  loadtest:
    image: grafana/k6:1.3.0
    profiles: ["loadtest"]
    environment:
      BASE_URL: http://gateway/api/v1
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Ourworld2026!}
    volumes: ["./tests/load:/scripts:ro", "./artifacts:/artifacts"]
    command: ["run", "--summary-export=/artifacts/load-summary.json", "/scripts/mixed.js"]
    depends_on:
      gateway: { condition: service_started }

volumes:
  postgres-data:
  redis-data:
  storage-data:
  frontend-releases:
