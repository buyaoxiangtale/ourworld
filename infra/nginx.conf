upstream ourworld_api { server api:3000; keepalive 32; }
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 12m;
  # The globe bundle is a ~2.6MB module script; gzip cuts transfer to roughly a quarter.
  # JPEG/PNG assets are already compressed and stay untouched by gzip_types defaults.
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types application/javascript application/json font/woff2 image/svg+xml text/css text/javascript text/plain;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location /api/v1/ws {
    proxy_pass http://ourworld_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }
  location /api/ {
    proxy_pass http://ourworld_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /metrics { return 404; }
  location = /api/v1/openapi.json { alias /usr/share/nginx/html/openapi.json; }
  # Hashed build output can be cached for good; a new build produces a new name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri =404;
  }
  # The globe bundle is content-hashed too.
  location /globe/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri =404;
  }
  # Entry documents are not content-hashed, so always revalidate. Without this the
  # browser keeps the previous deploy cached, including the globe iframe document.
  location ~* \.html$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri =404;
  }
  location /globe/ { try_files $uri $uri/ =404; }
  location / { try_files $uri $uri/ /index.html; }
}
