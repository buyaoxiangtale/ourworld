<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/><link rel="stylesheet" href="/starlight.css"><style>
html{background:var(--ow-space)}
html,body,#globe{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{touch-action:none}
canvas{display:block}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
#twinkle{position:fixed;inset:0;z-index:0;pointer-events:none}
#twinkle i{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--ow-starBright);box-shadow:0 0 6px color-mix(in srgb, var(--ow-starBright) 75%, transparent);animation:twinkle 4.5s ease-in-out infinite}
#twinkle i:nth-child(3n){width:1px;height:1px;background:var(--ow-starSoft)}
#twinkle i:nth-child(5n){width:3px;height:3px}
@keyframes twinkle{0%,100%{transform:scale(.75);opacity:.15}50%{transform:scale(1.25);opacity:.85}}
@media (prefers-reduced-motion:reduce){#twinkle i{animation:none;opacity:.5}}
html.globe-idle #twinkle i{animation-play-state:paused}
#globe{position:relative;z-index:1}
#fallback{display:none;position:fixed;inset:0;color:var(--ow-inkMuted);text-align:center;padding:35vh 15px 0;box-sizing:border-box;background:var(--ow-space);z-index:11}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:color-mix(in srgb, var(--ow-space) 42%, transparent);color:var(--ow-inkMuted);z-index:10;transition:opacity .4s}
#boot.done{opacity:0;pointer-events:none;visibility:hidden}
#boot.done .earth-spinner{animation:none}
@media (prefers-reduced-motion:reduce){#boot{transition:none}}
</style></head><body><canvas id="stars" aria-hidden="true"></canvas><div id="twinkle" aria-hidden="true"></div><div id="globe"></div><div id="boot" role="status" aria-label="Loading globe"><i class="earth-spinner" aria-hidden="true"></i></div><div id="fallback" role="img" aria-label="Globe unavailable"></div>
<script type="module" src="/src/main.ts"></script></body></html>
