<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/><style>
html{background:#05080D}
html,body,#globe{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{touch-action:none}
canvas{display:block}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
#twinkle{position:fixed;inset:0;z-index:0;pointer-events:none}
#twinkle i{position:absolute;width:2px;height:2px;border-radius:50%;background:#F5F9FF;box-shadow:0 0 6px rgba(245,249,255,.75);animation:twinkle 4.5s ease-in-out infinite}
#twinkle i:nth-child(3n){width:1px;height:1px;background:#D7E1F0}
#twinkle i:nth-child(5n){width:3px;height:3px}
@keyframes twinkle{0%,100%{transform:scale(.75);opacity:.15}50%{transform:scale(1.25);opacity:.85}}
@media (prefers-reduced-motion:reduce){#twinkle i{animation:none;opacity:.5}}
html.globe-idle #twinkle i{animation-play-state:paused}
#globe{position:relative;z-index:1}
#fallback{display:none;position:fixed;inset:0;color:#A5AFB8;text-align:center;padding:35vh 15px 0;box-sizing:border-box;background:#05080D;z-index:11}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:rgba(5,8,13,.42);color:#A5AFB8;z-index:10;transition:opacity .4s}
#boot.done{opacity:0;pointer-events:none}
.boot-ring{display:block;width:34px;height:34px;border-radius:50%;border:2px solid rgba(165,175,184,.25);border-top-color:#6496E6;animation:boot-spin 1s linear infinite}
#boot span{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#E8EDF0}
@keyframes boot-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.boot-ring{animation:none;border-top-color:rgba(165,175,184,.5)}#boot{transition:none}}
</style></head><body><canvas id="stars" aria-hidden="true"></canvas><div id="twinkle" aria-hidden="true"></div><div id="globe"></div><div id="boot" role="status" aria-label="Loading globe"><i class="boot-ring"></i><span>OURWORLD</span></div><div id="fallback" role="img" aria-label="Globe unavailable"></div>
<script type="module" src="/src/main.ts"></script></body></html>
