[project]
name = "ourworld-tools"
version = "0.1.0"
description = "Repository tooling for the Ourworld applications"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.scripts]
ourworld = "ourworld_tools.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.14,<0.15"]
media = ["pillow>=12,<13"]

[tool.uv]
default-groups = ["dev", "media"]

[tool.uv.build-backend]
module-root = "tools"

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["tools/**/*.py", "tests/tools/**/*.py", "scripts/assets/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
